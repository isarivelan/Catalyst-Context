      type: float64
      list: false
    nullable: true
  cycleHours:
    type:
      type: float64
      list: false
    nullable: true
  deviations:
    type:
      type: int32
      list: false
    nullable: true
  unit:
    type:
      type: direct
      list: false
    nullable: true
