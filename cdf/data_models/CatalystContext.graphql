type Site {
  name: String!
  industry: String
  description: String
  region: String
  equipment: [Equipment]
}

type Equipment {
  name: String!
  kind: String
  industry: String
  description: String
  criticality: String
  parent: Equipment
  site: Site
  signals: [ProcessSignal]
  events: [ProcessEvent]
  files: [EngineeringFile]
}

type ProcessSignal {
  name: String!
  unit: String
  externalTag: String
  industry: String
  equipment: Equipment
}

type Batch {
  batchId: String!
  recipe: String
  status: String
  yieldPct: Float
  cycleHours: Float
  deviations: Int
  unit: Equipment
  qualityResults: [QualityResult]
}

type QualityResult {
  test: String
  status: String
  result: String
  batch: Batch
  lab: Equipment
}

type ProcessEvent {
  eventType: String
  subtype: String
  description: String
  industry: String
  equipment: Equipment
}

type EngineeringFile {
  name: String!
  mimeType: String
  kind: String
  equipment: Equipment
}
